name: db-tests

on:
  pull_request:
    paths:
      - "infra/migrations/**"
      - "infra/tests/**"
      - ".github/workflows/db-tests.yml"
  push:
    branches: [main]
    paths:
      - "infra/migrations/**"
      - "infra/tests/**"

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          # The superuser is named supabase_admin so the tests can create a
          # non-superuser "postgres" role, like the one Supabase migrations run as.
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci-only
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to a fresh database and run the tests
        env:
          ADMIN_URL: postgresql://supabase_admin@localhost:5432/postgres
        run: infra/tests/run --fresh-local
